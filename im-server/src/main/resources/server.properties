# IM 服务端配置
# 所有可调参数外置；命令行 --port/--file-port/--db 优先级最高。

# ---- 主端口 ----
server.port=8080
server.backlog=128
server.max-connections=1000
# 读线程池初始大小（会按连接数增长到 max-connections）
server.worker-threads=8
# 每会话发送队列容量，满则判定慢消费者并断开
server.send-queue-size=1024
# 空闲判定秒数（阶段 3 接入检测线程）
server.heartbeat-seconds=90

# ---- 文件端口 ----
file.port=8081
file.dir=data/files
# 单文件上限：100 MB
file.max-size=104857600
file.threads=4

# ---- 安全 ----
# PBKDF2 迭代次数；登录高峰的 CPU 开销主要来自这里（benchmark.md 有数据）
security.pbkdf2-iterations=120000

# ---- 数据库 ----
# 默认 H2 文件模式（MySQL 兼容），切 MySQL 8 只需改 url/user/password
db.url=jdbc:h2:file:./data/im;MODE=MySQL;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
# 连接池：压测表明 10 已足够（H2 写事务串行化），MySQL 场景可上调
db.pool-size=10
