# IM 服务端配置（阶段 1）
# 所有可调参数外置；命令行 --port 优先级最高。

# 主端口（聊天与控制流）
server.port=8080
# 连接队列长度
server.backlog=128
# 最大并发连接数，超限回 SERVER_BUSY
server.max-connections=1000
# 读线程池大小（0 或留空按 CPU×2 计算）
server.worker-threads=8
# 每会话发送队列容量，满则判定慢消费者并断开
server.send-queue-size=1024
# 服务端空闲判定秒数（阶段 2 启用）
server.heartbeat-seconds=90

# 文件传输端口（阶段 4 启用）
file.port=8081
# 文件存储目录
file.dir=data/files
# 单文件大小上限：100 MB
file.max-size=104857600

# 密码哈希 PBKDF2 迭代次数
security.pbkdf2-iterations=120000
